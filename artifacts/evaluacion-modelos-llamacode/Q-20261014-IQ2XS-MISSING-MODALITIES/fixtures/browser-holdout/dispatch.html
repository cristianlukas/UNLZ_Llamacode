<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch Console · Holdout R4</title>
<style>body{font:18px sans-serif;max-width:760px;margin:4rem auto;padding:0 2rem;color:#15243a}fieldset{border:1px solid #789;padding:1.5rem}label{display:block;margin:1rem 0 .35rem}input,select,textarea,button{font:inherit;padding:.55rem}button{margin-top:1.25rem}#confirmation{padding:1rem;background:#eef6ef;min-height:2rem}</style></head>
<body><main><h1>Dispatch Console</h1><p>Work order <strong>R4-82</strong> is ready for routing.</p>
<form id="dispatch"><fieldset><legend>Route work order R4-82</legend>
<label for="destination">Destination</label><select id="destination" name="destination"><option value="">Choose a destination</option><option>Harbor Point</option><option>Quartz Bay</option><option>Juniper Ridge</option></select>
<label><input id="priority" name="priority" type="checkbox"> Priority shipping</label>
<label for="note">Handling note</label><input id="note" name="note" type="text" placeholder="Enter handling note">
<button type="submit">Confirm dispatch</button></fieldset></form>
<p id="confirmation" role="status" aria-live="polite">No dispatch has been confirmed.</p>
</main><script>document.querySelector('#dispatch').addEventListener('submit',e=>{e.preventDefault();const d=document.querySelector('#destination').value;const p=document.querySelector('#priority').checked;const n=document.querySelector('#note').value.trim();document.querySelector('#confirmation').textContent=(d==='Quartz Bay'&&p&&n==='route checked')?'Confirmed R4-82 Quartz Bay Priority route checked':'Dispatch not verified. Review the selected route and details.';});</script></body></html>
